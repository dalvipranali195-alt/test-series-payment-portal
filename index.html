function getIdentity() {
  const sess = loadSession();
  if (!sess) return null;
  if (sess.type === 'admin') return { type: 'admin', label: 'Main Admin', branch: null };
  const staff = state.staff.find(s => s.staffId === sess.staffId);
  if (!staff || !staff.active) return null;
  const roles = staff.roles || [];
  const isCoordinator = roles.includes('Branch Coordinator');
  const workRoles = roles.filter(r => r !== 'Branch Coordinator');
  return { type: 'staff', staff, isCoordinator, workRoles, branch: staff.branch, label: staff.name };
}
function scopeBranch(identity) { return identity.type === 'admin' ? null : identity.branch; }

/* ---------- publish / persist ---------- */
async function persistAndPublish(nextState, successMsg) {
  try {
    const html = renderFullDocument(nextState);
    const cap = await artifactCapPromise;
    if (!cap) {
      state = nextState;
      closeModal(); render();
      showToast(successMsg || 'Saved.');
      return true;
    }
    await cap.publish(html);
    state = nextState;
    closeModal(); render();
    if (successMsg) showToast(successMsg);
    return true;
  } catch (err) {
    const code = err && err.code;
    if (code === 'conflict') {
      showToast('Someone else just saved changes — refreshing…');
    } else if (code === 'not_writer' || code === 'not_granted') {
      readOnly = true;
      const banner = document.getElementById('readonly-banner');
      if (banner) banner.style.display = 'block';
      renderNav(); render();
      showToast('You have read-only access here.');
    } else {
      showToast('Could not save. Please try again.');
    }
    return false;
  }
}

function submitStaff(e, editingId) {
  e.preventDefault();
  const staffId = document.getElementById('f-staffId').value.trim();
  const name = document.getElementById('f-name').value.trim();
  const roles = Array.from(document.querySelectorAll('.checkbox-group input:checked')).map(c => c.value);
  const branch = document.getElementById('f-branch').value;
  const session = document.getElementById('f-session').value.trim();
  const contact = document.getElementById('f-contact').value.trim();
  const email = document.getElementById('f-email').value.trim();
  const pin = document.getElementById('f-pin').value.trim();
  const active = document.getElementById('f-active').value === 'true';
  if (!staffId || !name || !contact || !pin) return;
  if (!editingId && state.staff.some(s => s.staffId.toLowerCase() === staffId.toLowerCase())) { showToast('That Staff ID already exists.'); return; }
  const next = deepClone(state);
  if (editingId) {
    const s = next.staff.find(x => x.staffId === editingId);
    Object.assign(s, { name, roles, branch, session, contact, email, pin, active });
    [next.checker, next.supervisor, next.openday].forEach(list => list.forEach(r => { if (r.staffId === editingId) r.staffName = name; }));
  } else {
    next.staff.push({ staffId, name, roles, branch, session, contact, email, pin, active });
  }
  persistAndPublish(next, editingId ? 'Staff updated.' : 'Staff added.');
}
function toggleStaffActive(staffId) {
  const next = deepClone(state);
  next.staff.find(x => x.staffId === staffId).active = !staffById(staffId).active;
  persistAndPublish(next, 'Status updated.');
}
function deleteStaff(staffId) {
  const used = state.checker.some(r => r.staffId === staffId) || state.supervisor.some(r => r.staffId === staffId) || state.openday.some(r => r.staffId === staffId);
  const msg = used ? 'This staff member has records. Delete anyway? Their records will be kept.' : 'Delete this staff member?';
  if (!confirm(msg)) return;
  const next = deepClone(state);
  next.staff = next.staff.filter(s => s.staffId !== staffId);
  persistAndPublish(next, 'Staff deleted.');
}

/* ---------- records: shared helpers ---------- */
function recordTypeMeta(kind) {
  if (kind === 'checker') return { list: state.checker, dateField: 'dateOfPaper' };
  if (kind === 'supervisor') return { list: state.supervisor, dateField: 'date' };
  return { list: state.openday, dateField: 'date' };
}
function getListKey(kind) { return kind; }
function findRecord(kind, id) { return state[getListKey(kind)].find(r => r.id === id); }
function scopedList(identity, kind) {
  const meta = recordTypeMeta(kind);
  let rows = meta.list.slice();
  const branch = scopeBranch(identity);
  if (branch) rows = rows.filter(r => r.branch === branch);
  if (identity.type === 'staff' && !identity.isCoordinator) rows = rows.filter(r => r.staffId === identity.staff.staffId);
  if (identity.type === 'admin' && adminRecordsBranchFilter) rows = rows.filter(r => r.branch === adminRecordsBranchFilter);
  return rows;
}
function availableRecordKinds(identity) {
  if (identity.type === 'admin') return ['checker', 'supervisor', 'openday'];
  const kinds = [];
  if (identity.workRoles.includes('Paper Checker')) kinds.push('checker');
  if (identity.workRoles.includes('Supervisor')) kinds.push('supervisor');
  if (identity.workRoles.includes('Open Day Examiner')) kinds.push('openday');
  if (identity.isCoordinator && !kinds.length) return ['checker', 'supervisor', 'openday'];
  return kinds;
}
function canFillFor(identity, roleTag) { return identity.type === 'admin' || (identity.type === 'staff' && identity.workRoles.includes(roleTag)); }
function canEditDraftOrReject(identity, record) {
  if (identity.type === 'admin') return true;
  return identity.type === 'staff' && record.staffId === identity.staff.staffId && (record.approvalStatus === 'draft' || record.approvalStatus === 'rejected');
}
function canReviewRecord(identity, record) {
  if (identity.type === 'admin') return true;
  return !!identity.isCoordinator && identity.branch === record.branch && record.staffId !== identity.staff.staffId;
}
function canTogglePayment(identity, record) {
  if (record.approvalStatus !== 'approved') return false;
  return identity.type === 'admin' || (identity.isCoordinator && identity.branch === record.branch);
}
function kindCap(kind) { return kind === 'checker' ? 'Checker' : kind === 'supervisor' ? 'Supervisor' : 'OpenDay'; }
function recordRowActions(identity, kind, r) {
  const parts = [];
  if (canEditDraftOrReject(identity, r)) {
    parts.push(`<button class="btn btn-ghost btn-sm" onclick="open${kindCap(kind)}Modal('${r.id}')">Edit</button>`);
    if (r.approvalStatus === 'draft') parts.push(`<button class="btn btn-primary btn-sm" onclick="submitForApproval('${kind}','${r.id}')">Submit</button>`);
    parts.push(`<button class="btn btn-danger btn-sm" onclick="deleteRecord('${kind}','${r.id}')">Delete</button>`);
  }
  if (canReviewRecord(identity, r) && r.approvalStatus === 'pending') {
    parts.push(`<button class="btn btn-primary btn-sm" onclick="approveRecord('${kind}','${r.id}')">Approve</button>`);
    parts.push(`<button class="btn btn-danger btn-sm" onclick="openRejectModal('${kind}','${r.id}')">Reject</button>`);
  }
  if (identity.type === 'admin' && (r.approvalStatus === 'approved' || r.approvalStatus === 'rejected' || r.approvalStatus === 'pending')) {
    parts.push(`<button class="btn btn-ghost btn-sm" onclick="reopenRecord('${kind}','${r.id}')">Reopen</button>`);
  } else if (canReviewRecord(identity, r) && (r.approvalStatus === 'approved' || r.approvalStatus === 'rejected')) {
    parts.push(`<button class="btn btn-ghost btn-sm" onclick="reopenRecord('${kind}','${r.id}')">Reopen</button>`);
  }
  return parts.join('');
}

function renderRecordsTab(identity) {
  const kinds = availableRecordKinds(identity);
  if (!kinds.length) return emptyState('You do not have a work role assigned yet. Ask the Main Admin to update your staff profile.');
  if (!kinds.includes(recordsSubTab)) recordsSubTab = kinds[0];
  const labelMap = { checker: 'Paper Checker', supervisor: 'Supervisor', openday: 'Open Day' };
  let html = '';
  if (kinds.length > 1) html += `<div class="segmented">${kinds.map(k => `<button class="${recordsSubTab === k ? 'active' : ''}" onclick="setRecordsSubTab('${k}')">${labelMap[k]}</button>`).join('')}</div>`;
  if (identity.type === 'admin') html += `<div class="filter-bar"><select onchange="adminRecordsBranchFilter=this.value; render();"><option value="">All Branches</option>${state.branches.map(b => `<option value="${escapeHtml(b)}" ${adminRecordsBranchFilter === b ? 'selected' : ''}>${escapeHtml(b)}</option>`).join('')}</select></div>`;
  if (recordsSubTab === 'checker') html += renderCheckerSection(identity);
  else if (recordsSubTab === 'supervisor') html += renderSupervisorSection(identity);
  else html += renderOpenDaySection(identity);
  return html;
}
function setRecordsSubTab(k) { recordsSubTab = k; render(); }

/* ---------- approval actions (shared across record types) ---------- */
function submitForApproval(kind, id) {
  const next = deepClone(state);
  const r = next[kind].find(x => x.id === id);
  r.approvalStatus = 'pending'; r.submittedAt = todayStr();
  persistAndPublish(next, 'Submitted for approval.');
}
function approveRecord(kind, id) {
  if (!confirm('Approve this record? It will count toward the approved payment total.')) return;
  const next = deepClone(state);
  const r = next[kind].find(x => x.id === id);
  r.approvalStatus = 'approved'; r.rejectReason = '';
  persistAndPublish(next, 'Record approved.');
}
function openRejectModal(kind, id) {
  showModal(`
    <h3>Reject Record</h3>
    <form onsubmit="submitReject(event, '${kind}', '${id}')">
      <div class="field"><label>Reason for rejection</label><textarea id="reject-reason" rows="3" required></textarea></div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-danger">Reject Record</button>
      </div>
    </form>
  `);
}
function submitReject(e, kind, id) {
  e.preventDefault();
  const reason = document.getElementById('reject-reason').value.trim();
  if (!reason) return;
  const next = deepClone(state);
  const r = next[kind].find(x => x.id === id);
  r.approvalStatus = 'rejected'; r.rejectReason = reason;
  persistAndPublish(next, 'Record rejected.');
}
function reopenRecord(kind, id) {
  if (!confirm('Reopen this record for editing? It will go back to Draft status.')) return;
  const next = deepClone(state);
  const r = next[kind].find(x => x.id === id);
  r.approvalStatus = 'draft';
  persistAndPublish(next, 'Record reopened for editing.');
}
function togglePaymentStatus(kind, id) {
  const next = deepClone(state);
  const r = next[kind].find(x => x.id === id);
  r.paymentStatus = r.paymentStatus === 'Paid' ? 'Pending' : 'Paid';
  persistAndPublish(next, 'Payment status updated.');
}
function deleteRecord(kind, id) {
  if (!confirm('Delete this record?')) return;
  const next = deepClone(state);
  next[kind] = next[kind].filter(r => r.id !== id);
  persistAndPublish(next, 'Record deleted.');
}

function recalcCheckerTotal() {

}
function submitChecker(e, editingId) {
  e.preventDefault();
  const identity = getIdentity();
  const staffId = document.getElementById('ck-staff').value;
  const staff = staffById(staffId);
  if (!staff) { showToast('Please select a valid staff member.'); return; }
  const numPapers = Number(document.getElementById('ck-numPapers').value) || 0;
  const rate = Number(document.getElementById('ck-rate').value) || 0;
  const answerKeyCharge = Number(document.getElementById('ck-answerKeyCharge').value) || 0;
  const issuedBy = document.getElementById('ck-issuedBy').value;
  const collectedBy = document.getElementById('ck-collectedBy').value;
  const issuedStaff = staffById(issuedBy);
  const collectedStaff = staffById(collectedBy);
  const approvalStatus = identity.type === 'admin' ? document.getElementById('ck-approval').value : (window.__ckSaveMode || 'draft');
  const prevSubmittedAt = editingId ? findRecord('checker', editingId).submittedAt : '';
  const rec = {
    dateOfPaper: document.getElementById('ck-date').value,
    branch: document.getElementById('ck-branch').value,
    ...readMasterFields('ck'),
    staffId, staffName: staff.name,
    exam: document.getElementById('ck-exam').value.trim(),
    subject: document.getElementById('ck-subject').value.trim(),
    marks: Number(document.getElementById('ck-marks').value) || 0,
    numPapers, rate, answerKeyCharge, total: numPapers * rate + answerKeyCharge,
    issuedBy, issuedByName: issuedStaff ? issuedStaff.name : '',
    collectedBy, collectedByName: collectedStaff ? collectedStaff.name : '',
    approvalStatus, submittedAt: approvalStatus === 'pending' ? todayStr() : prevSubmittedAt
  };
  const next = deepClone(state);
  if (editingId) {
    const existing = next.checker.find(r => r.id === editingId);
    rec.paymentStatus = existing.paymentStatus;
    rec.rejectReason = approvalStatus === 'rejected' ? existing.rejectReason : '';
    Object.assign(existing, rec);
  } else {
    next.checker.push(Object.assign({ id: uid('c'), paymentStatus: 'Pending', rejectReason: '' }, rec));
  }
  window.__ckSaveMode = null;
  persistAndPublish(next, approvalStatus === 'pending' ? 'Submitted for approval.' : 'Saved.');
}

function recalcSupervisorTotal() {
  const h = Number(document.getElementById('sv-hours')?.value || 0);
  const r = Number(document.getElementById('sv-rate')?.value || 0);
  const el = document.getElementById('sv-total-preview');
  if (el) el.textContent = money(h * r);
}
function submitSupervisor(e, editingId) {
  e.preventDefault();
  const identity = getIdentity();
  const staffId = document.getElementById('sv-staff').value;
  const staff = staffById(staffId);
  if (!staff) { showToast('Please select a valid staff member.'); return; }
  const workingHours = Number(document.getElementById('sv-hours').value) || 0;
  const rate = Number(document.getElementById('sv-rate').value) || 0;
  const approvalStatus = identity.type === 'admin' ? document.getElementById('sv-approval').value : (window.__svSaveMode || 'draft');
  const prevSubmittedAt = editingId ? findRecord('supervisor', editingId).submittedAt : '';
  const existingSession = editingId ? (findRecord('supervisor', editingId).session || '') : '';
  const rec = {
    date: document.getElementById('sv-date').value,
    branch: document.getElementById('sv-branch').value,
    ...readMasterFields('sv', false), session: existingSession,
    staffId, staffName: staff.name,
    exam: document.getElementById('sv-exam').value.trim(),
    detail: document.getElementById('sv-detail').value.trim(),
    workingHours, rate, total: workingHours * rate,
    approvalStatus, submittedAt: approvalStatus === 'pending' ? todayStr() : prevSubmittedAt
  };
  const next = deepClone(state);
  if (editingId) {
    const existing = next.supervisor.find(r => r.id === editingId);
    rec.paymentStatus = existing.paymentStatus;
    rec.rejectReason = approvalStatus === 'rejected' ? existing.rejectReason : '';
    Object.assign(existing, rec);
  } else {
    next.supervisor.push(Object.assign({ id: uid('v'), paymentStatus: 'Pending', rejectReason: '' }, rec));
  }
  window.__svSaveMode = null;
  persistAndPublish(next, approvalStatus === 'pending' ? 'Submitted for approval.' : 'Saved.');
}

/* ---------- exports: CSV + PDF ---------- */
function csvEscape(v) { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function orgHeaderInfo() {
  const s = state.settings;
  const name = s.orgName || '';
  const lines = [s.orgDescription, s.orgLocation, s.orgContact].filter(Boolean);
  return { name, lines };
}
function orgCsvLine() {
  const org = orgHeaderInfo();
  if (!org.name) return '';
  return [org.name, ...org.lines].join(' | ');
}
function buildCsv(columns, rows, filterSummary) {
  const lines = [];
  const orgLine = orgCsvLine();
  if (orgLine) lines.push(csvEscape(orgLine));
  if (filterSummary) lines.push(csvEscape('Filters: ' + filterSummary));
  lines.push(columns.map(c => csvEscape(c.label)).join(','));
  rows.forEach(r => lines.push(columns.map(c => csvEscape(r[c.key])).join(',')));
  return '﻿' + lines.join('\r\n');
}

/* ---------- shared low-level PDF helpers ---------- */
function pdfEscapeText(s) {
  return String(s ?? '').split('').map(c => c.charCodeAt(0) > 255 ? '?' : c).join('').replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
}
function dataUrlToBytes(dataUrl) {
  const base64 = (dataUrl.split(',')[1] || '');
  const bin = atob(base64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
function bytesToBinaryString(bytes) {
  let s = '';
  const chunk = 8192;
  for (let i = 0; i < bytes.length; i += chunk) s += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  return s;
}
function parseJpegDimensions(bytes) {
  let i = 2;
  while (i < bytes.length - 9) {
    if (bytes[i] !== 0xFF) { i++; continue; }
    const marker = bytes[i + 1];
    if (marker === 0xFF) { i++; continue; }
    if (marker === 0xD8 || marker === 0x01 || (marker >= 0xD0 && marker <= 0xD9)) { i += 2; continue; }
    if (marker >= 0xC0 && marker <= 0xCF && marker !== 0xC4 && marker !== 0xC8 && marker !== 0xCC) {
      const height = (bytes[i + 5] << 8) | bytes[i + 6];
      const width = (bytes[i + 7] << 8) | bytes[i + 8];
      return { width, height };
    }
    const len = (bytes[i + 2] << 8) | bytes[i + 3];
    i += 2 + len;
  }
  return null;
}
function addLogoImageObject(reserve, setObj) {
  const dataUrl = state.settings.orgLogo;
  if (!dataUrl) return null;
  try {
    const bytes = dataUrlToBytes(dataUrl);
    const dims = parseJpegDimensions(bytes);
    if (!dims || !dims.width || !dims.height) return null;
    const imgNum = reserve();
    setObj(imgNum, `<< /Type /XObject /Subtype /Image /Width ${dims.width} /Height ${dims.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${bytes.length} >>\nstream\n${bytesToBinaryString(bytes)}\nendstream`);
    let hpt = 40, wpt = 40 * (dims.width / dims.height);
    if (wpt > 100) { wpt = 100; hpt = 100 * (dims.height / dims.width); }
    return { objNum: imgNum, wpt, hpt };
  } catch (e) { return null; }
}
function finalizePdfObjects(objects, catalogNum) {
  let pdf = '%PDF-1.4\n';
  const offsets = [0];
  objects.forEach((obj, idx) => { offsets.push(pdf.length); pdf += `${idx + 1} 0 obj\n${obj}\nendobj\n`; });
  const xrefStart = pdf.length;
  pdf += `xref\n0 ${objects.length + 1}\n0000000000 65535 f \n`;
  for (let i = 1; i <= objects.length; i++) pdf += String(offsets[i]).padStart(10, '0') + ' 00000 n \n';
  pdf += `trailer\n<< /Size ${objects.length + 1} /Root ${catalogNum} 0 R >>\nstartxref\n${xrefStart}\n%%EOF`;
  const bytes = new Uint8Array(pdf.length);
  for (let i = 0; i < pdf.length; i++) bytes[i] = pdf.charCodeAt(i) & 0xFF;
  return new Blob([bytes], { type: 'application/pdf' });
}

function buildPdf(opts) {
  const title = opts.title, subtitle = opts.subtitle || '', columns = opts.columns, dataRows = opts.rows, totalsLines = opts.totalsLines || [];
  const pageWidth = 841.89, pageHeight = 595.28, margin = 30;
  const rowHeight = 14;
  const org = orgHeaderInfo();
  const objects = [];
  function reserve() { objects.push(''); return objects.length; }
  function setObj(n, c) { objects[n - 1] = c; }
  const catalogNum = reserve(), pagesNum = reserve(), fontRegNum = reserve(), fontBoldNum = reserve();
  setObj(fontRegNum, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>');
  setObj(fontBoldNum, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>');
  const logo = org.name ? addLogoImageObject(reserve, setObj) : null;
  const orgHeaderHeight = org.name ? Math.max(logo ? logo.hpt : 0, 15 + org.lines.length * 11) + 12 : 0;
  const topBlock = 62 + orgHeaderHeight;
  const bottomReserve = totalsLines.length ? totalsLines.length * 14 + 10 : 0;
  const rowsPerPage = Math.max(6, Math.floor((pageHeight - margin * 2 - topBlock - bottomReserve) / rowHeight));
  const pages = [];
  for (let i = 0; i < dataRows.length; i += rowsPerPage) pages.push(dataRows.slice(i, i + rowsPerPage));
  if (!pages.length) pages.push([]);
  const kidNums = [];
  pages.forEach((pageRows, pageIdx) => {
    let y = pageHeight - margin;
    const lines = [];
    let imageOps = '';
    if (pageIdx === 0 && org.name) {
      let textX = margin;
      if (logo) { imageOps = `q\n${logo.wpt.toFixed(2)} 0 0 ${logo.hpt.toFixed(2)} ${margin} ${(y - logo.hpt).toFixed(2)} cm\n/Im0 Do\nQ\n`; textX = margin + logo.wpt + 10; }
      let oy = y;
      lines.push({ x: textX, y: oy, size: 13, font: 'F2', t: org.name }); oy -= 14;
      org.lines.forEach(l => { lines.push({ x: textX, y: oy, size: 8, font: 'F1', t: l }); oy -= 11; });
      y -= orgHeaderHeight;
    }
    lines.push({ x: margin, y, size: 13, font: 'F2', t: title }); y -= 16;
    if (subtitle) { lines.push({ x: margin, y, size: 9, font: 'F1', t: subtitle }); y -= 13; }
    lines.push({ x: pageWidth - margin - 80, y: pageHeight - margin, size: 8, font: 'F1', t: `Page ${pageIdx + 1}/${pages.length}` });
    y -= 6;
    let x = margin;
    columns.forEach(col => { lines.push({ x, y, size: 8, font: 'F2', t: col.label }); x += col.width; });
    y -= 12;
    pageRows.forEach(row => {
      x = margin;
      columns.forEach(col => { lines.push({ x, y, size: 8, font: 'F1', t: String(row[col.key] ?? '') }); x += col.width; });
      y -= rowHeight;
    });
    if (pageIdx === pages.length - 1 && totalsLines.length) {
      y -= 6;
      totalsLines.forEach(tl => { lines.push({ x: margin, y, size: 10, font: 'F2', t: tl }); y -= 14; });
    }
    let stream = imageOps + 'BT\n';
    lines.forEach(l => { stream += `/${l.font} ${l.size} Tf\n1 0 0 1 ${l.x.toFixed(2)} ${l.y.toFixed(2)} Tm\n(${pdfEscapeText(l.t)}) Tj\n`; });
    stream += 'ET\n';
    const contentNum = reserve();
    setObj(contentNum, `<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);
    const pageNum = reserve();
    const resourceXObj = (pageIdx === 0 && logo) ? ` /XObject << /Im0 ${logo.objNum} 0 R >>` : '';
    setObj(pageNum, `<< /Type /Page /Parent ${pagesNum} 0 R /MediaBox [0 0 ${pageWidth} ${pageHeight}] /Resources << /Font << /F1 ${fontRegNum} 0 R /F2 ${fontBoldNum} 0 R >>${resourceXObj} >> /Contents ${contentNum} 0 R >>`);
    kidNums.push(pageNum);
  });
  setObj(catalogNum, `<< /Type /Catalog /Pages ${pagesNum} 0 R >>`);
  setObj(pagesNum, `<< /Type /Pages /Kids [${kidNums.map(n => n + ' 0 R').join(' ')}] /Count ${kidNums.length} >>`);
  return finalizePdfObjects(objects, catalogNum);
}

    lines.push({ x: textX, y: oy, size: 16, font: 'F2', t: org.name }); oy -= 16;
    org.lines.forEach(l => { lines.push({ x: textX, y: oy, size: 9, font: 'F1', t: l }); oy -= 12; });
    y -= Math.max(logo ? logo.hpt : 0, 16 + org.lines.length * 12) + 16;
  }
  fills.push(y);
  y -= 22;
  lines.push({ x: pageWidth / 2 - 48, y, size: 15, font: 'F2', t: 'SALARY SLIP' });
  y -= 26;

  function row2(label1, val1, label2, val2) {
    lines.push({ x: margin, y, size: 9, font: 'F1', t: label1 });
    lines.push({ x: margin + 95, y, size: 9.5, font: 'F2', t: val1 });
    lines.push({ x: pageWidth / 2 + 10, y, size: 9, font: 'F1', t: label2 });
    lines.push({ x: pageWidth / 2 + 105, y, size: 9.5, font: 'F2', t: val2 });
    y -= 17;
  }
  row2('Staff Name:', data.staff ? data.staff.name : '-', 'Staff ID:', data.staff ? data.staff.staffId : '-');
  row2('Role(s):', (data.staff && data.staff.roles || []).join(', ') || '-', 'Branch:', (data.staff && data.staff.branch) || '-');
  row2('Month / Year:', monthLabel(monthStr), 'Generated:', todayStr());
  y -= 10;

  lines.push({ x: margin, y, size: 9, font: 'F2', t: 'Payment Type' });
  lines.push({ x: pageWidth - margin - 110, y, size: 9, font: 'F2', t: 'Approved Amount' });
  y -= 6;
  fills.push(y);
  y -= 16;
  function tableRow(label, amount, bold) {
    lines.push({ x: margin, y, size: 9.5, font: bold ? 'F2' : 'F1', t: label });
    lines.push({ x: pageWidth - margin - 110, y, size: 9.5, font: bold ? 'F2' : 'F1', t: moneyPlain(amount) });
    y -= 17;
  }
  tableRow(`Paper Checker Payment (${data.checkerRows.length} record${data.checkerRows.length === 1 ? '' : 's'})`, data.checkerTotal);
  tableRow(`Supervisor Payment (${data.supervisorRows.length} record${data.supervisorRows.length === 1 ? '' : 's'})`, data.supervisorTotal);
  tableRow(`Open Day Payment (${data.openDayRows.length} record${data.openDayRows.length === 1 ? '' : 's'})`, data.openDayTotal);
  y -= 4;
  fills.push(y);
  y -= 18;
  tableRow('Total Approved Amount', data.totalApproved, true);
  if (data.alreadyPaid) {
    lines.push({ x: margin, y, size: 9, font: 'F1', t: 'Already Paid' });
    lines.push({ x: pageWidth - margin - 110, y, size: 9, font: 'F1', t: '- ' + moneyPlain(data.alreadyPaid) });
    y -= 17;
  }
  y -= 6;
  fills.push(y);
  y -= 20;
  lines.push({ x: margin, y, size: 12.5, font: 'F2', t: 'Final Payable Amount' });
  lines.push({ x: pageWidth - margin - 110, y, size: 12.5, font: 'F2', t: moneyPlain(data.finalPayable) });
  y -= 34;
  lines.push({ x: margin, y, size: 7.5, font: 'F1', t: 'This slip includes only approved records for the selected month. Pending or rejected records are excluded.' });

  let stream = imageOps + 'BT\n';
  lines.forEach(l => { stream += `/${l.font} ${l.size} Tf\n1 0 0 1 ${l.x.toFixed(2)} ${l.y.toFixed(2)} Tm\n(${pdfEscapeText(l.t)}) Tj\n`; });
  stream += 'ET\n0.7 0.7 0.7 rg\n';
  fills.forEach(fy => { stream += `${margin} ${fy.toFixed(2)} ${(pageWidth - margin * 2).toFixed(2)} 0.75 re f\n`; });

  const contentNum = reserve();
  setObj(contentNum, `<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);
  const pageNum = reserve();
  const resourceXObj = logo ? ` /XObject << /Im0 ${logo.objNum} 0 R >>` : '';
  setObj(pageNum, `<< /Type /Page /Parent ${pagesNum} 0 R /MediaBox [0 0 ${pageWidth} ${pageHeight}] /Resources << /Font << /F1 ${fontRegNum} 0 R /F2 ${fontBoldNum} 0 R >>${resourceXObj} >> /Contents ${contentNum} 0 R >>`);
  setObj(catalogNum, `<< /Type /Catalog /Pages ${pagesNum} 0 R >>`);
  setObj(pagesNum, `<< /Type /Pages /Kids [${pageNum} 0 R] /Count 1 >>`);
  return finalizePdfObjects(objects, catalogNum);
}

async function offerDownload(filename, data, fallbackCsvText) {
  const dl = await downloadsCapPromise;
  if (!dl) { showToast('Downloads are not available in this view.'); return; }
  try {
    await dl.save({ filename, data });
    showToast('Download started.');
  } catch (err) {
    const code = err && err.code;
    if ((code === 'extension_not_enabled' || code === 'rejected_extension') && fallbackCsvText) {
      const altName = filename.replace(/\.[^.]+$/, '.txt');
      try { await dl.save({ filename: altName, data: fallbackCsvText }); showToast('That file type is not enabled here — downloaded as .txt instead.'); }
      catch (e2) { showToast('Download is not available in this view.'); }
    } else if (code === 'declined') {
      /* user cancelled — no toast */
    } else {
      showToast('Could not prepare the download. Please try again.');
    }
  }
}

function saveOrgDetails(e) {
  e.preventDefault();
  const next = deepClone(state);
  next.settings.orgName = document.getElementById('org-name').value.trim();
  next.settings.orgDescription = document.getElementById('org-description').value.trim();
  next.settings.orgLocation = document.getElementById('org-location').value.trim();
  next.settings.orgContact = document.getElementById('org-contact').value.trim();
  persistAndPublish(next, 'Organisation details saved.');
}
function handleLogoUpload(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) { showToast('Please choose an image file.'); return; }
  if (file.size > 3 * 1024 * 1024) { showToast('Logo image is too large (max 3MB).'); return; }
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const maxDim = 300;
      let w = img.width, h = img.height;
      if (w > maxDim || h > maxDim) { const scale = maxDim / Math.max(w, h); w = Math.round(w * scale); h = Math.round(h * scale); }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      const jpegDataUrl = canvas.toDataURL('image/jpeg', 0.85);
      const next = deepClone(state);
      next.settings.orgLogo = jpegDataUrl;
      persistAndPublish(next, 'Logo updated.');
    };
    img.onerror = () => showToast('Could not read that image file.');
    img.src = reader.result;
  };
  reader.onerror = () => showToast('Could not read that file.');
  reader.readAsDataURL(file);
}
function removeLogo() {
  if (!confirm('Remove the organisation logo?')) return;
  const next = deepClone(state);
  next.settings.orgLogo = '';
  persistAndPublish(next, 'Logo removed.');
}
function saveRates(e) {
  e.preventDefault();
  const next = deepClone(state);
  next.settings.checkerRate = Number(document.getElementById('set-checkerRate').value) || 0;
  next.settings.supervisorRate = Number(document.getElementById('set-supervisorRate').value) || 0;
  next.settings.openDayRate = Number(document.getElementById('set-openDayRate').value) || 0;
  persistAndPublish(next, 'Default rates saved.');
}
function addBranch(e) {
  e.preventDefault();
  const name = document.getElementById('new-branch-name').value.trim();
  if (!name) return;
  if (state.branches.some(b => b.toLowerCase() === name.toLowerCase())) { showToast('Branch already exists.'); return; }
  const next = deepClone(state);
  next.branches.push(name);
  persistAndPublish(next, 'Branch added.');
}
function removeBranch(name) {
  if (state.staff.some(s => s.branch === name)) { showToast('Cannot remove a branch that has staff assigned.'); return; }
  if (!confirm(`Remove branch "${name}"?`)) return;
  const next = deepClone(state);
  next.branches = next.branches.filter(b => b !== name);
  persistAndPublish(next, 'Branch removed.');
}
function changePassword(e) {
  e.preventDefault();
  const cur = document.getElementById('set-currentPw').value;
  const newPw = document.getElementById('set-newPw').value;
  if (cur !== state.settings.adminPassword) { showToast('Current password is incorrect.'); return; }
  const next = deepClone(state);
  next.settings.adminPassword = newPw;
  persistAndPublish(next, 'Password updated.');
}
function resetAllData() {
  if (!confirm('This will delete ALL staff and payment records for everyone. Continue?')) return;
  if (!confirm('Are you absolutely sure? This cannot be undone.')) return;
  const next = defaultState();
  next.settings.adminPassword = state.settings.adminPassword;
  next.staff = []; next.checker = []; next.supervisor = []; next.openday = [];
  persistAndPublish(next, 'All data erased.');
}

whenBodyReady(function init() {
  const identity = getIdentity();
  if (identity) showApp(); else showLoginScreen();
});
